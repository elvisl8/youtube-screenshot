<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328; }
  h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.5; }
  #captureBtn { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; background: #c00; color: #fff; cursor: pointer; margin-bottom: 10px; }
  #captureBtn:hover { background: #e00; }
  #captureBtn:disabled { background: #ccc; cursor: not-allowed; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px solid #eee; font-size: 13px; }
  .kbd { background: #f0f0f0; border: 1px solid #d0d0d0; border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; }
  .links { display: flex; gap: 8px; margin-top: 12px; }
  .links button { flex: 1; padding: 8px 4px; font-size: 12px; border: 1px solid #ddd; border-radius: 7px; background: #fff; cursor: pointer; }
  .links button:hover { background: #f6f6f6; }
  #msg { font-size: 12px; line-height: 1.6; min-height: 18px; }
  .ok { color: #1e8e3e; }
  .err { color: #c0392b; }
  .note { font-size: 11px; color: #888; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
  <h1>📸 YouTube 截屏</h1>
  <div class="sub">在 YouTube 播放页点下面按钮、按快捷键，或点播放器右下角的相机按钮，都能截下当前帧。</div>

  <button id="captureBtn">截取当前帧</button>
  <div id="msg"></div>

  <div class="row"><span>全局快捷键</span><span class="kbd" id="shortcut">读取中…</span></div>
  <div class="row"><span>截图格式</span><span id="fmt">PNG</span></div>
  <div class="row"><span>截后动作</span><span id="act">先预览</span></div>

  <div class="links">
    <button id="openShortcuts">修改快捷键</button>
    <button id="openOptions">设置</button>
  </div>

  <div class="note">干净帧是视频原生分辨率、不带控制条和字幕；想要字幕一起截，在设置里把画面模式改成「所见即所得」。</div>

<script src="popup.js"></script>
</body>
</html>
